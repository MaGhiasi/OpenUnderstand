[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["openunderstand"]
addopts = "-v --cov=openunderstand --cov-report=term-missing --cov-report=xml --cov-report=html --cov-branch"

[tool.coverage.run]
branch = true
source = ["openunderstand"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["test_analysis"]