[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "openunderstand"]
addopts = "-v --cov=openunderstand --cov-report=term-missing --cov-report=xml --cov-report=html --cov-branch"

[tool.coverage.run]
branch = true
source = ["openunderstand"]

[tool.coverage.report]
fail_under = 20

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["test_analysis"]



[tool.mutmut]
source_paths = ["openunderstand/"]
pytest_add_cli_args_test_selection = ["tests/"]
runner = "python -m pytest -o addopts='-v --continue-on-collection-errors'"
debug = true
timeout_constant = 1.0
timeout_multiplier = 15.0
do_not_mutate = [
    "openunderstand/analysis_passes/gen/*",
    "openunderstand/gen/*",
]
pytest_add_cli_args = ["--no-cov"]