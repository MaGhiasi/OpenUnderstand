name: CI

on:
  push:
    branches: [ "feature/testing-*", "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov coverage ruff

      - name: Lint with ruff
        run: ruff check .
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          pytest --cov=openunderstand --cov-report=xml --cov-report=html --cov-report=term-missing --cov-branch --cov-fail-under=80
        continue-on-error: true

      - name: Check branch coverage gate
        run: |
          coverage report --fail-under=80
        continue-on-error: true
        
      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml

      - name: Upload pytest results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/